name: Test Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # allow manual trigger

jobs:
  # ── Headless real-QGIS tests (conda-forge qgis, offscreen) ─────────────
  headless-qgis-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Provision QGIS env (micromamba)
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-file: ci/qgis-env.yml
        cache-environment: true

    - name: HYDRA fast-fail (real headless QGIS)
      run: |
        PYTHONPATH="$PWD:$PWD/build:$PWD/tests" \
          QT_QPA_PLATFORM=offscreen \
          micromamba run -n hydra-ci bash tools/fast_fail.sh

    - name: Set up Python (lint/audit tools)
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Python security audit (Bandit)
      run: |
        pip install bandit>=1.7
        python3 -m bandit -r swe2d/ --quiet || echo "Bandit findings (non-fatal, review recommended)"

    - name: Python style audit
      run: |
        python3 tools/python_style_audit.py || echo "Style audit warnings (non-fatal)"

    - name: Python dead code audit (Vulture)
      run: |
        pip install vulture>=2.14
        python3 -m vulture .

    - name: Verify pdoc builds without errors
      run: |
        pip install pdoc>=14.0
        cd docs && pdoc ../swe2d --skip-errors --docformat numpy --output-dir /tmp/pdoc-check

    - name: C++ host-code static analysis (Cppcheck)
      run: |
        sudo apt-get install -y cppcheck
        cppcheck --enable=warning,performance,information \
          --suppress=cstyleCast \
          --suppress=unmatchedSuppression \
          --error-exitcode=0 \
          --quiet \
          cpp/src/ || echo "Cppcheck warnings (non-fatal)"

    - name: Shellcheck tools/fast_fail.sh
      run: |
        sudo apt-get install -y shellcheck
        shellcheck tools/fast_fail.sh

  # ── Build + unit tests (requires hydra_swe2d native module) ───────────
  build-and-cpu-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ python3-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python deps
      run: |
        pip install numpy gmsh>=4.12

    - name: Install CUDA toolkit
      uses: Jimver/cuda-toolkit@v0.2.35
      with:
        cuda: '12.4.0'
        method: network

    - name: Build native module (CUDA, tests skip gracefully without GPU)
      run: |
        mkdir -p build && cd build
        cmake .. -DBACKWATER_USE_CUDA=ON -DCMAKE_BUILD_TYPE=Release
        make -j$(nproc)

    - name: Run mesh and import tests (no GPU required)
      run: |
        PYTHONPATH="$PWD:$PWD/build:$PWD/tests" \
          python3 -m unittest -v \
          tests.test_swe2d_mesh

  # ── Optional: headless QGIS smoke test (QGIS must be available) ──────
  qgis-smoke-test:
    runs-on: ubuntu-latest
    continue-on-error: true  # non-blocking: requires QGIS CI runner setup
    steps:
    - uses: actions/checkout@v4

    - name: Install QGIS + Xvfb
      run: |
        sudo apt-get update
        sudo apt-get install -y qgis python3-qgis xvfb

    - name: Start Xvfb
      run: |
        export DISPLAY=":99"
        Xvfb "$DISPLAY" -screen 0 1280x1024x24 &
        echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"

    - name: Run headless QGIS smoke test
      run: |
        bash tests/run_headless_qgis_tests.sh --qgis

    - name: HYDRA fast-fail (QGIS + MCP walk)
      run: |
        PYTHONPATH="$PWD:$PWD/build:$PWD/tests" \
          HYDRA_MCP_INTEGRATION=1 \
          mamba run -n qgis_stable bash tools/fast_fail.sh

    - name: Run behavioral MCP GUI tests
      run: |
        PYTHONPATH="$PWD:$PWD/build:$PWD/tests" \
          python3 -m unittest -v tests.test_gui_behavioral_mcp
