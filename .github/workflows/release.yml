name: Release (manual)

# Manual-dispatch release path.  The tag-push path now lives inside
# build-wheels.yml (its `release` job depends on the two wheel jobs in
# the SAME workflow, which GitHub Actions allows).  This workflow exists
# only so a maintainer can cut a release by hand after a failed build
# was fixed — it re-downloads the wheels the build-wheels run just
# uploaded and attaches them to the existing tag.
#
# Trigger: `gh workflow run release.yml -f tag_name=v0.3.0` or the
# "Run workflow" button with the tag input.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to attach the release to (e.g. v0.3.0). Required."
        required: true
        type: string

permissions:
  contents: write
  actions: read        # gh CLI needs to read other workflow runs on dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from pyproject.toml
        run: python tools/sync_version.py

      # Download the wheels the most-recently-finished build-wheels run
      # uploaded for this tag, then attach them to the release.
      - name: Download wheel artifacts from latest build-wheels run
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          runs = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/workflows/build-wheels.yml/runs",
               "--jq", ".workflow_runs[] | select(.conclusion == \"success\") | .id"],
              env={**os.environ},
          ).decode())
          if not runs:
              raise SystemExit("no successful build-wheels run found")
          latest = runs[0]
          out = Path("artifacts"); out.mkdir(exist_ok=True)
          subprocess.check_call(
              ["gh", "run", "download", str(latest), "--repo", repo,
               "--pattern", "wheels-*", "--dir", str(out)],
              env={**os.environ},
          )
          wheels = sorted(p for p in out.rglob("*.whl"))
          print(f"downloaded {len(wheels)} wheels from run {latest}:",
                [p.name for p in wheels])
          PY

      - name: Build QGIS plugin zip
        run: python tools/package_plugin.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            artifacts/**/*.whl
            dist/HYDRA2DGPU-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
