[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.13", "numpy"]
build-backend = "scikit_build_core.build"

[project]
name = "hydra-swe2d"
version = "1.3.0"
description = "HYDRA2DGPU — GPU-accelerated 2D hydraulic solver for QGIS"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "gmsh>=4.12",
    # Workbench (Studio viewer / graph editor) imports this at runtime.
    "pyqtgraph>=0.14",
]

[project.optional-dependencies]
dev = [
    "vulture>=2.14",
    # GUI testing — qtbot.waitSignal / addWidget for live viewer tests
    "pytest-qt>=4.0",
    # Phase 6: build the wheel locally for smoke testing
    "build>=1.0",
]

[tool.pytest.ini_options]
# pytest-qt: use PyQt5 (project standard) instead of PySide6 (pytest-qt default)
qt_api = "pyqt5"

[tool.scikit-build]
# Phase 6: wheel build config for scikit-build-core. Tells it where
# the CMake project is and how to build. The C++ extension is the
# primary deliverable; the wheel contains the compiled .so.
build-dir = "_skbuild"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
# Phase 6: pass our existing CMake options through to the build.
BACKWATER_USE_CUDA = "ON"

[tool.scikit-build.wheel]
# Bundle the user-facing Python package (swe2d/) alongside the compiled
# hydra_swe2d/ C++ extension. Without this, scikit-build-core only packages
# what CMakeLists.txt's install(TARGETS ...) rules emit, which excludes
# swe2d/ entirely. The QGIS plugin imports `swe2d.*` on initGui(), so
# `swe2d/` MUST be in the wheel for the plugin to start.
#
# tests/ and tools/ are bundled so the production-path install test
# (tools/release_install_test.sh) can run the full suite from the
# installed wheel in qgis_clean without the repo on sys.path; tools/
# also makes the MCP bridge importable in production (hydra_plugin.py
# imports tools.hydra_mcp.qgis_bridge).
packages = ["swe2d", "tests", "tools"]

[project.scripts]
swe2d-cli = "swe2d.cli.__main__:main"

[project.urls]
Homepage  = "https://github.com/aspragueumkc/hydra2dgpu"
Repository = "https://github.com/aspragueumkc/hydra2dgpu"
Issues    = "https://github.com/aspragueumkc/hydra2dgpu/issues"